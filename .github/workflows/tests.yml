name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: test-secret-that-is-long-enough-for-builds
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://maintenance_app:maintenance_app@localhost:5432/maintenance_app_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check-links
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: maintenance_app_test
          POSTGRES_USER: maintenance_app
          POSTGRES_PASSWORD: maintenance_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_app -d maintenance_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: test-secret-that-is-long-enough-for-builds
      BETTER_AUTH_URL: http://localhost:3000
      E2E_DATABASE_URL: postgresql://maintenance_app:maintenance_app@localhost:5432/maintenance_app_test?schema=public
      DATABASE_URL: postgresql://maintenance_app:maintenance_app@localhost:5432/maintenance_app_build?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create restricted app role
        run: sh docker/db-init/01-app-role.sh
        env:
          PGHOST: localhost
          PGPASSWORD: maintenance_app
          POSTGRES_USER: maintenance_app
          POSTGRES_DB: maintenance_app_test
      - run: pnpm db:migrate:e2e
      - run: pnpm test:legacy-ownership
      - name: Tenant isolation (RLS) integration tests
        run: pnpm test:rls
        env:
          RLS_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  container-image:
    needs: [unit, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.sha }}
      MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}:${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.sha }}-migrator
      APP_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    outputs:
      artifact_name: ${{ steps.save-images.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging migration gate
        env:
          APP_IMAGE_TAG: test-app
          MIGRATOR_IMAGE_TAG: test-migrator
          DATABASE_URL: postgresql://runtime:test@db.invalid/maintenance_app?schema=public
          MIGRATION_DATABASE_URL: postgresql://owner:test@db.invalid/maintenance_app?schema=public
          BETTER_AUTH_SECRET: test-only-secret-that-is-long-enough
          BETTER_AUTH_URL: https://staging.invalid
        run: |
          set -euo pipefail

          config="$(docker compose -f docker-compose.staging.yml config --format json)"
          jq -e '
            .services.app.depends_on.migrator.condition == "service_completed_successfully"
            and .services.migrator.restart == "no"
            and .services.migrator.environment.MIGRATION_DATABASE_URL != null
            and .services.app.environment.MIGRATION_DATABASE_URL == null
            and (.services.app.networks | has("coolify"))
            and (.services.migrator.networks | has("coolify"))
            and .networks.coolify.external == true
          ' <<< "$config" >/dev/null
      - name: Validate Coolify deployment authorization wiring
        run: |
          set -euo pipefail
          workflow=".github/workflows/deploy-staging.yml"
          grep -Fq 'coolify_auth_header="Authorization: Bearer $COOLIFY_API_TOKEN"' "$workflow"
          test "$(grep -Fc -- '--header "$coolify_auth_header"' "$workflow")" -eq 4
          ! grep -Fq 'Authorization: ******' "$workflow"
          grep -Fq '  wait-for-coolify:' "$workflow"
          grep -Fq '  verify-staging:' "$workflow"
          test "$(grep -Fc "if: needs.deploy.outputs.should_deploy == 'true'" "$workflow")" -eq 2
          grep -Fq 'deployment_status_url="$coolify_api_url/api/v1/deployments/$deployment_uuid"' "$workflow"
          grep -Fq 'deployment_deadline=$((SECONDS + 900))' "$workflow"
          grep -Fq 'health_deadline=$((SECONDS + 180))' "$workflow"
          grep -Fq 'failed|cancelled-by-user' "$workflow"
          grep -Fq 'consecutive_successes >= 2' "$workflow"
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_BUILD_SHA=${{ env.APP_BUILD_SHA }}
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          platforms: linux/amd64
          tags: ${{ env.MIGRATOR_IMAGE }}
          load: true
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan migration image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.MIGRATOR_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Save validated images
        id: save-images
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          APP_IMAGE: ${{ env.IMAGE }}
          MIGRATOR_IMAGE: ${{ env.MIGRATOR_IMAGE }}
          APP_BUILD_SHA: ${{ env.APP_BUILD_SHA }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            artifact_name="validated-images-pr-${PR_NUMBER}-${HEAD_SHA}-${GITHUB_RUN_ATTEMPT}"
          else
            artifact_name="validated-images-main-${HEAD_SHA}-${GITHUB_RUN_ATTEMPT}"
          fi

          mkdir -p "$RUNNER_TEMP/validated-images"
          docker save \
            --output "$RUNNER_TEMP/validated-images/images.tar" \
            "$APP_IMAGE" "$MIGRATOR_IMAGE"
          jq -n \
            --argjson pull_request "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg tested_tree_sha "$(git rev-parse 'HEAD^{tree}')" \
            --arg app_build_sha "$APP_BUILD_SHA" \
            --arg app_image "$APP_IMAGE" \
            --arg migrator_image "$MIGRATOR_IMAGE" \
            '{schema_version: 1, pull_request: $pull_request, head_sha: $head_sha, tested_tree_sha: $tested_tree_sha, app_build_sha: $app_build_sha, app_image: $app_image, migrator_image: $migrator_image}' \
            > "$RUNNER_TEMP/validated-images/manifest.json"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.save-images.outputs.artifact_name }}
          path: ${{ runner.temp }}/validated-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-main:
    needs: [container-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-migrator
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.container-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/validated-images
      - name: Load validated images
        run: docker load --input "${{ runner.temp }}/validated-images/images.tar"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit images
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker push "$MIGRATOR_IMAGE"
