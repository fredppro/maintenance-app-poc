name: Deploy staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  locate-validation:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.validation.outputs.artifact_name }}
      pull_number: ${{ steps.validation.outputs.pull_number }}
      app_build_sha: ${{ steps.validation.outputs.app_build_sha }}
      should_deploy: ${{ steps.validation.outputs.should_deploy }}
      tested_tree_sha: ${{ steps.validation.outputs.tested_tree_sha }}
      merge_commit_sha: ${{ steps.validation.outputs.merge_commit_sha }}
      test_run_id: ${{ steps.validation.outputs.test_run_id }}
    steps:
      - name: Find successful PR checks and validated image artifact
        id: validation
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const mergeCommitSha = context.sha;
            const { data: branch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'develop',
            });
            if (branch.commit.sha !== mergeCommitSha) {
              core.notice(`Skipping ${mergeCommitSha}; develop has advanced to ${branch.commit.sha}.`);
              core.setOutput('should_deploy', 'false');
              return;
            }

            const associatedPullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: mergeCommitSha, per_page: 100 }
            );
            const pullRequest = associatedPullRequests.find(candidate =>
              candidate.base.ref === 'develop' &&
              candidate.merged_at &&
              candidate.merge_commit_sha === mergeCommitSha
            );
            if (!pullRequest) {
              throw new Error(`No merged PR to develop was found for commit ${mergeCommitSha}.`);
            }

            const pullNumber = pullRequest.number;
            const headSha = pullRequest.head.sha;

            const { data: mergeCommit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: mergeCommitSha,
            });
            const testedTreeSha = mergeCommit.commit.tree.sha;

            async function latestRun(workflowId) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: workflowId,
                  event: 'pull_request',
                  branch: pullRequest.head.ref,
                  per_page: 100,
                }
              );
              // GitHub may omit pull_requests from workflow runs after the PR closes.
              const matching = runs
                .filter(run => run.head_sha === headSha)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

              if (matching.length === 0) {
                throw new Error(`No ${workflowId} validation run was found for PR #${pullNumber} at ${headSha}.`);
              }

              const run = matching[0];
              if (run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error(`${workflowId} run ${run.id} is ${run.status}/${run.conclusion}; refusing deployment.`);
              }
              return run;
            }

            const testRun = await latestRun('tests.yml');
            await latestRun('security.yml');

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: testRun.id, per_page: 100 }
            );
            const artifactName = `validated-images-pr-${pullNumber}-${headSha}-${testRun.run_attempt}`;
            const artifact = artifacts.find(item => item.name === artifactName && !item.expired);
            if (!artifact) {
              throw new Error(`Validated image artifact ${artifactName} is missing or expired.`);
            }

            core.setOutput('pull_number', String(pullNumber));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('app_build_sha', headSha);
            core.setOutput('should_deploy', 'true');
            core.setOutput('tested_tree_sha', testedTreeSha);
            core.setOutput('merge_commit_sha', mergeCommitSha);
            core.setOutput('test_run_id', String(testRun.id));

  deploy:
    needs: [locate-validation]
    if: needs.locate-validation.outputs.should_deploy == 'true'
    outputs:
      deployment_uuid: ${{ steps.deploy.outputs.deployment_uuid }}
      should_deploy: ${{ steps.promote.outputs.should_deploy }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      actions: read
      contents: read
      packages: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.locate-validation.outputs.artifact_name }}
          path: ${{ runner.temp }}/validated-images
          run-id: ${{ needs.locate-validation.outputs.test_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and load validated images
        shell: bash
        env:
          EXPECTED_PR: ${{ needs.locate-validation.outputs.pull_number }}
          EXPECTED_HEAD_SHA: ${{ needs.locate-validation.outputs.app_build_sha }}
          EXPECTED_TREE_SHA: ${{ needs.locate-validation.outputs.tested_tree_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.locate-validation.outputs.merge_commit_sha }}
          APP_IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          manifest="$RUNNER_TEMP/validated-images/manifest.json"
          if [[ ! -f "$manifest" || ! -f "$RUNNER_TEMP/validated-images/images.tar" ]]; then
            echo "::error::The validated image artifact is incomplete."
            exit 1
          fi

          jq -e \
            --argjson pr "$EXPECTED_PR" \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg tree "$EXPECTED_TREE_SHA" \
            --arg app "${APP_IMAGE_NAME}:pr-${EXPECTED_PR}-${EXPECTED_HEAD_SHA}" \
            --arg migrator "${APP_IMAGE_NAME}:pr-${EXPECTED_PR}-${EXPECTED_HEAD_SHA}-migrator" \
            '.schema_version == 1 and .pull_request == $pr and .head_sha == $head and .app_build_sha == $head and .tested_tree_sha == $tree and .app_image == $app and .migrator_image == $migrator' \
            "$manifest" >/dev/null

          docker load --input "$RUNNER_TEMP/validated-images/images.tar"
          echo "Validated image source tree matches merged commit $EXPECTED_MERGE_SHA."
      - name: Check deployment configuration
        env:
          STAGING_AUTODEPLOY_ENABLED: ${{ vars.STAGING_AUTODEPLOY_ENABLED }}
          STAGING_COOLIFY_APP_UUID: ${{ vars.STAGING_COOLIFY_APP_UUID }}
          STAGING_COMPOSE_MIGRATION_ENABLED: ${{ vars.STAGING_COMPOSE_MIGRATION_ENABLED }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          STAGING_WIREGUARD_CONFIG: ${{ secrets.STAGING_WIREGUARD_CONFIG }}
        run: |
          set -euo pipefail
          if [[ "$STAGING_AUTODEPLOY_ENABLED" != "true" ]]; then
            echo "::error::Set the STAGING_AUTODEPLOY_ENABLED repository variable to true to deploy staging."
            exit 1
          fi
          if [[ -z "$STAGING_COOLIFY_APP_UUID" ]]; then
            echo "::error::Set the STAGING_COOLIFY_APP_UUID repository variable to the staging Compose application UUID."
            exit 1
          fi
          if [[ "$STAGING_COMPOSE_MIGRATION_ENABLED" != "true" ]]; then
            echo "::error::Set STAGING_COMPOSE_MIGRATION_ENABLED to true only after Coolify is configured with docker-compose.staging.yml and its migration secrets."
            exit 1
          fi
          if [[ -z "$COOLIFY_API_TOKEN" || -z "$STAGING_WIREGUARD_CONFIG" ]]; then
            echo "::error::Configure COOLIFY_API_TOKEN and STAGING_WIREGUARD_CONFIG in the staging environment."
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote validated images
        id: promote
        shell: bash
        env:
          EXPECTED_PR: ${{ needs.locate-validation.outputs.pull_number }}
          EXPECTED_HEAD_SHA: ${{ needs.locate-validation.outputs.app_build_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.locate-validation.outputs.merge_commit_sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          current_head="$(git ls-remote --exit-code origin refs/heads/develop | awk 'NR == 1 { print $1 }')"
          if [[ "$current_head" != "$EXPECTED_MERGE_SHA" ]]; then
            echo "::notice::Skipping image promotion because develop advanced to $current_head."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          app_source="${IMAGE_NAME}:pr-${EXPECTED_PR}-${EXPECTED_HEAD_SHA}"
          migrator_source="${app_source}-migrator"
          app_tag="${IMAGE_NAME}:${EXPECTED_HEAD_SHA}"
          migrator_tag="${app_tag}-migrator"

          push_with_retries() {
            local image="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "Pushing $image (attempt $attempt/3)"
              if docker push "$image"; then
                return 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::Failed to push $image after $attempt attempts."
                return 1
              fi
              sleep $((attempt * 10))
            done
          }

          docker tag "$app_source" "$app_tag"
          docker tag "$migrator_source" "$migrator_tag"
          push_with_retries "$app_tag"
          push_with_retries "$migrator_tag"

          app_digest="$(docker buildx imagetools inspect "$app_tag" | awk '$1 == "Digest:" { print $2; exit }')"
          migrator_digest="$(docker buildx imagetools inspect "$migrator_tag" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ ! "$app_digest" =~ ^sha256:[0-9a-f]{64}$ || ! "$migrator_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve promoted image digests."
            exit 1
          fi

          app_digest_tag="${IMAGE_NAME}:sha256-${app_digest#sha256:}"
          migrator_digest_tag="${IMAGE_NAME}:sha256-${migrator_digest#sha256:}-migrator"
          docker tag "$app_tag" "$app_digest_tag"
          docker tag "$migrator_tag" "$migrator_digest_tag"
          push_with_retries "$app_digest_tag"
          push_with_retries "$migrator_digest_tag"
          echo "app_digest=${IMAGE_NAME}@${app_digest}" >> "$GITHUB_OUTPUT"
          echo "migrator_digest=${IMAGE_NAME}@${migrator_digest}" >> "$GITHUB_OUTPUT"
          echo "coolify_image_tag=${app_digest_tag##*:}" >> "$GITHUB_OUTPUT"
          echo "coolify_migrator_image_tag=${migrator_digest_tag##*:}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
      - name: Deploy exact image to staging
        if: steps.promote.outputs.should_deploy == 'true'
        shell: bash
        env:
          STAGING_COOLIFY_APP_UUID: ${{ vars.STAGING_COOLIFY_APP_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          STAGING_WIREGUARD_CONFIG: ${{ secrets.STAGING_WIREGUARD_CONFIG }}
          COOLIFY_IMAGE_TAG: ${{ steps.promote.outputs.coolify_image_tag }}
          COOLIFY_MIGRATOR_IMAGE_TAG: ${{ steps.promote.outputs.coolify_migrator_image_tag }}
          EXPECTED_MERGE_SHA: ${{ needs.locate-validation.outputs.merge_commit_sha }}
        id: deploy
        run: |
          set -euo pipefail

          current_head="$(git ls-remote --exit-code origin refs/heads/develop | awk 'NR == 1 { print $1 }')"
          if [[ "$current_head" != "$EXPECTED_MERGE_SHA" ]]; then
            echo "::notice::Skipping staging deployment because develop advanced to $current_head."
            exit 0
          fi

          coolify_api_url="http://10.242.0.1:8000"
          coolify_app_uuid="$STAGING_COOLIFY_APP_UUID"
          coolify_auth_header="Authorization: Bearer $COOLIFY_API_TOKEN"
          wg_config_path="/etc/wireguard/staging-deploy.conf"
          deployment_response="$(mktemp)"

          cleanup() {
            if [[ -f "$wg_config_path" ]]; then
              if ! sudo wg-quick down "$wg_config_path" >/dev/null 2>&1; then
                echo "::warning::Could not tear down the temporary WireGuard interface."
              fi
              if ! sudo rm -f "$wg_config_path"; then
                echo "::warning::Could not remove the temporary WireGuard config."
              fi
            fi
            if ! rm -f "$deployment_response"; then
              echo "::warning::Could not remove the temporary deployment response."
            fi
          }
          trap cleanup EXIT

          if ! command -v wg-quick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes wireguard-tools
          fi

          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$STAGING_WIREGUARD_CONFIG" | sudo tee "$wg_config_path" >/dev/null
          sudo chmod 600 "$wg_config_path"
          if sudo grep -Eiq '^[[:space:]]*(PreUp|PostUp|PreDown|PostDown|SaveConfig|Table|DNS)[[:space:]]*=' "$wg_config_path"; then
            echo "::error::The staging WireGuard config contains unsupported directives."
            exit 1
          fi
          allowed_ips="$(sudo awk -F= '/^[[:space:]]*AllowedIPs[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); print $2 }' "$wg_config_path")"
          if [[ "$allowed_ips" != "10.242.0.1/32" ]]; then
            echo "::error::The staging WireGuard peer must route only 10.242.0.1/32."
            exit 1
          fi
          sudo wg-quick up "$wg_config_path"

          application_url="$coolify_api_url/api/v1/applications/$coolify_app_uuid"
          payload="$(jq -cn --arg commit "$EXPECTED_MERGE_SHA" '{git_branch: "develop", git_commit_sha: $commit}')"
          if ! patch_status="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --request PATCH \
            --header "$coolify_auth_header" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$application_url")"; then
            echo "::error::Could not update the staging image in Coolify."
            exit 1
          fi
          if [[ ! "$patch_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Coolify rejected the staging source-revision update (HTTP $patch_status)."
            exit 1
          fi

          environment_payload="$(jq -cn \
            --arg app_tag "$COOLIFY_IMAGE_TAG" \
            --arg migrator_tag "$COOLIFY_MIGRATOR_IMAGE_TAG" \
            '{data: [
              {key: "APP_IMAGE_TAG", value: $app_tag, is_literal: true, is_runtime: true, is_buildtime: true, comment: "Validated staging application image"},
              {key: "MIGRATOR_IMAGE_TAG", value: $migrator_tag, is_literal: true, is_runtime: true, is_buildtime: true, comment: "Validated staging migrator image"}
            ]}')"
          if ! env_status="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --request PATCH \
            --header "$coolify_auth_header" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$environment_payload" \
            "$application_url/envs/bulk")"; then
            echo "::error::Could not set the validated staging image tags in Coolify."
            exit 1
          fi
          if [[ ! "$env_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Coolify rejected the staging image-tag update (HTTP $env_status)."
            exit 1
          fi

          if ! deploy_status="$(curl --silent --show-error --max-time 30 \
            --output "$deployment_response" --write-out '%{http_code}' \
            --request POST \
            --header "$coolify_auth_header" \
            --header 'Accept: application/json' \
            "$coolify_api_url/api/v1/deploy?uuid=$coolify_app_uuid")"; then
            echo "::error::Could not trigger the Coolify staging deployment."
            exit 1
          fi
          if [[ ! "$deploy_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Coolify rejected the staging deployment request (HTTP $deploy_status)."
            exit 1
          fi
          if ! deployment_uuid="$(jq -er --arg uuid "$coolify_app_uuid" \
            '.deployments[] | select(.resource_uuid == $uuid) | .deployment_uuid' \
            "$deployment_response")"; then
            echo "::error::Coolify did not return a deployment UUID for the staging application."
            exit 1
          fi

          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

  wait-for-coolify:
    needs: [locate-validation, deploy]
    if: needs.deploy.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Wait for Coolify deployment to finish
        shell: bash
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          STAGING_WIREGUARD_CONFIG: ${{ secrets.STAGING_WIREGUARD_CONFIG }}
          DEPLOYMENT_UUID: ${{ needs.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOYMENT_UUID" ]]; then
            echo "::error::The Coolify deployment UUID is missing; the deploy job did not publish its result."
            exit 1
          fi

          coolify_api_url="http://10.242.0.1:8000"
          coolify_auth_header="Authorization: Bearer $COOLIFY_API_TOKEN"
          wg_config_path="/etc/wireguard/staging-deploy.conf"
          deployment_status_response="$(mktemp)"

          cleanup() {
            if [[ -f "$wg_config_path" ]]; then
              if ! sudo wg-quick down "$wg_config_path" >/dev/null 2>&1; then
                echo "::warning::Could not tear down the temporary WireGuard interface."
              fi
              if ! sudo rm -f "$wg_config_path"; then
                echo "::warning::Could not remove the temporary WireGuard config."
              fi
            fi
            if ! rm -f "$deployment_status_response"; then
              echo "::warning::Could not remove the temporary deployment status response."
            fi
          }
          trap cleanup EXIT

          if ! command -v wg-quick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes wireguard-tools
          fi

          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$STAGING_WIREGUARD_CONFIG" | sudo tee "$wg_config_path" >/dev/null
          sudo chmod 600 "$wg_config_path"
          if sudo grep -Eiq '^[[:space:]]*(PreUp|PostUp|PreDown|PostDown|SaveConfig|Table|DNS)[[:space:]]*=' "$wg_config_path"; then
            echo "::error::The staging WireGuard config contains unsupported directives."
            exit 1
          fi
          allowed_ips="$(sudo awk -F= '/^[[:space:]]*AllowedIPs[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); print $2 }' "$wg_config_path")"
          if [[ "$allowed_ips" != "10.242.0.1/32" ]]; then
            echo "::error::The staging WireGuard peer must route only 10.242.0.1/32."
            exit 1
          fi
          sudo wg-quick up "$wg_config_path"

          deployment_status_url="$coolify_api_url/api/v1/deployments/$deployment_uuid"
          deployment_deadline=$((SECONDS + 900))
          poll_delay=5

          echo "Coolify queued deployment $deployment_uuid. Waiting up to 15 minutes for Coolify to finish."
          while (( SECONDS < deployment_deadline )); do
            if status_http="$(curl --silent --show-error --max-time 10 \
              --output "$deployment_status_response" --write-out '%{http_code}' \
              --header "$coolify_auth_header" \
              --header 'Accept: application/json' \
              "$deployment_status_url")"; then
              if [[ "$status_http" =~ ^2[0-9][0-9]$ ]]; then
                if ! deployment_state="$(jq -er '.status | strings' "$deployment_status_response")"; then
                  echo "::error::Coolify returned an invalid status response for deployment $deployment_uuid."
                  exit 1
                fi

                case "$deployment_state" in
                  finished)
                    echo "Coolify marked deployment $deployment_uuid finished."
                    exit 0
                    ;;
                  failed|cancelled-by-user)
                    echo "::error::Coolify deployment $deployment_uuid ended with status $deployment_state."
                    exit 1
                    ;;
                  queued|in_progress)
                    echo "Coolify deployment $deployment_uuid is $deployment_state."
                    ;;
                  *)
                    echo "::error::Coolify returned unsupported deployment status '$deployment_state' for $deployment_uuid."
                    exit 1
                    ;;
                esac
              elif [[ "$status_http" == "401" ]]; then
                echo "::error::Coolify rejected COOLIFY_API_TOKEN (HTTP 401). Verify the token is active, belongs to the staging team, and the runner IP is allowlisted."
                exit 1
              elif [[ "$status_http" == "403" ]]; then
                echo "::error::Coolify denied deployment-status polling (HTTP 403). Ensure COOLIFY_API_TOKEN has read permission and access to the staging Compose application."
                exit 1
              elif [[ "$status_http" =~ ^4[0-9][0-9]$ && "$status_http" != "429" ]]; then
                echo "::error::Coolify rejected deployment-status polling (HTTP $status_http) for deployment $deployment_uuid."
                exit 1
              else
                echo "::warning::Coolify deployment-status polling returned HTTP $status_http; retrying."
              fi
            else
              echo "::warning::Could not reach Coolify to read deployment $deployment_uuid status; retrying."
            fi

            remaining=$((deployment_deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            sleep_for="$poll_delay"
            if (( sleep_for > remaining )); then
              sleep_for="$remaining"
            fi
            sleep "$sleep_for"
            if (( poll_delay < 30 )); then
              poll_delay=$((poll_delay * 2))
              if (( poll_delay > 30 )); then
                poll_delay=30
              fi
            fi
          done

          echo "::error::Coolify deployment $deployment_uuid did not finish within 15 minutes."
          exit 1

  verify-staging:
    needs: [locate-validation, deploy, wait-for-coolify]
    if: needs.deploy.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify staging serves the validated revision
        shell: bash
        env:
          DEPLOYMENT_UUID: ${{ needs.deploy.outputs.deployment_uuid }}
          EXPECTED_REVISION: ${{ needs.locate-validation.outputs.app_build_sha }}
          STAGING_HEALTH_URL: https://staging.maintenance.isosist.com/api/health
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOYMENT_UUID" ]]; then
            echo "::error::The Coolify deployment UUID is missing; the deployment job did not publish its result."
            exit 1
          fi

          response_headers="$(mktemp)"
          trap 'rm -f "$response_headers"' EXIT

          health_deadline=$((SECONDS + 180))
          poll_delay=5
          consecutive_successes=0
          echo "Verifying deployment $DEPLOYMENT_UUID serves revision $EXPECTED_REVISION."

          while (( SECONDS < health_deadline )); do
            if http_status="$(curl --silent --show-error --max-time 8 \
              --dump-header "$response_headers" \
              --output /dev/null --write-out '%{http_code}' \
              "$STAGING_HEALTH_URL")"; then
              deployed_revision="$(awk 'tolower($1) == "x-application-revision:" { gsub("\r", "", $2); print $2; exit }' "$response_headers")"
              if [[ "$http_status" == "200" && "$deployed_revision" == "$EXPECTED_REVISION" ]]; then
                consecutive_successes=$((consecutive_successes + 1))
                echo "Health probe matched revision $deployed_revision ($consecutive_successes/2 consecutive successes)."
                if (( consecutive_successes >= 2 )); then
                  echo "Staging is healthy and serves revision $deployed_revision."
                  exit 0
                fi
                poll_delay=5
              else
                consecutive_successes=0
                echo "Health probe returned HTTP $http_status; revision=${deployed_revision:-not reported}."
              fi
            else
              consecutive_successes=0
              echo "::warning::Staging health endpoint is temporarily unreachable."
            fi

            remaining=$((health_deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            sleep_for="$poll_delay"
            if (( sleep_for > remaining )); then
              sleep_for="$remaining"
            fi
            sleep "$sleep_for"
            if (( poll_delay < 15 )); then
              poll_delay=$((poll_delay * 2))
              if (( poll_delay > 15 )); then
                poll_delay=15
              fi
            fi
          done

          echo "::error::Coolify deployment $DEPLOYMENT_UUID completed, but staging did not return two consecutive HTTP 200 responses for revision $EXPECTED_REVISION within 3 minutes."
          exit 1
