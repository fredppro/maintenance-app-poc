services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: maintenance_app
      POSTGRES_USER: maintenance_app
      POSTGRES_PASSWORD: maintenance_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance_app -d maintenance_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres-e2e:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: ["e2e"]
    environment:
      POSTGRES_DB: maintenance_app_test
      POSTGRES_USER: maintenance_app
      POSTGRES_PASSWORD: maintenance_app
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance_app -d maintenance_app_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
