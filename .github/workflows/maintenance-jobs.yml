name: Maintenance jobs

# Daily retention clean-up and durable object deletion retries. Needs the owner connection, so keep
# these secrets in a protected environment. Skips itself until configured.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    environment: production-maintenance
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_CLEANUP_ACCESS_KEY_ID: ${{ secrets.S3_CLEANUP_ACCESS_KEY_ID }}
      S3_CLEANUP_SECRET_ACCESS_KEY: ${{ secrets.S3_CLEANUP_SECRET_ACCESS_KEY }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::warning::MIGRATION_DATABASE_URL is not configured; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$S3_BUCKET" ] && { [ -z "$S3_CLEANUP_ACCESS_KEY_ID" ] || [ -z "$S3_CLEANUP_SECRET_ACCESS_KEY" ]; }; then
            echo "::warning::S3 cleanup credentials are not configured; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.run == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.config.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.config.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.config.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.run == 'true'
        run: |
          pnpm ops:retention
          pnpm ops:purge-trash
          pnpm ops:tenant purge-due
      - name: Retry durable object deletions
        if: steps.config.outputs.run == 'true'
        run: pnpm ops:storage:cleanup
